name: Deal watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's fastest schedule)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deal-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check feeds and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'shlomo-deals-5b8e55ffde' }}
        run: python watcher.py
      - name: Save what was already seen
        run: |
          if [ -n "$(git status --porcelain seen.json deals.json)" ]; then
            git config user.name "deal-watcher"
            git config user.email "deal-watcher@users.noreply.github.com"
            git add seen.json deals.json 2>/dev/null; git add seen.json
            git commit -m "update seen deals" -q
            git pull --rebase -q || true
            git push -q || true
          fi
