<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Steal Watch">
<meta name="theme-color" content="#11162e">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Steal Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a store window — one spotlight "steal of the day" tag up top, then a rack of hang-tag cards; prices are the loudest thing on the page */
:root{
  --bg:#f3f4f9; --surface:#ffffff; --raised:#fbfbfe; --ink:#11162e; --muted:#5b6283; --line:#e2e5f0;
  --accent:#e0266f; --accent-2:#ff7a45; --accent-soft:#fde7f0; --urgent:#b45309; --urgent-soft:#fff0d4; --ok:#0f7a55;
  --spot-bg:#11162e; --spot-ink:#ffffff; --spot-muted:#a9afcf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e1c; --surface:#141933; --raised:#1a2040; --ink:#eef0fb; --muted:#99a0c4; --line:#262d4f;
  --accent:#ff5a9c; --accent-2:#ff9a6b; --accent-soft:#3b1830; --urgent:#f5a524; --urgent-soft:#3b2b0f; --ok:#3fd19b;
  --spot-bg:#1d2350; --spot-ink:#ffffff; --spot-muted:#b3b9dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e1c; --surface:#141933; --raised:#1a2040; --ink:#eef0fb; --muted:#99a0c4; --line:#262d4f;
  --accent:#ff5a9c; --accent-2:#ff9a6b; --accent-soft:#3b1830; --urgent:#f5a524; --urgent-soft:#3b2b0f; --ok:#3fd19b;
  --spot-bg:#1d2350; --spot-ink:#ffffff; --spot-muted:#b3b9dc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;margin:0;line-height:1}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 22%,transparent)}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 24px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat.err b{color:var(--urgent)}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer}

.spot{margin-top:18px;background:var(--spot-bg);color:var(--spot-ink);border-radius:var(--r);padding:22px 22px 20px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:end}
.spot::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);pointer-events:none}
.spot .eyebrow{grid-column:1/-1;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.spot h2{margin:0;font:700 clamp(19px,4.4vw,26px)/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.spot h2 a{color:inherit;text-decoration:none}
.spot .sub{grid-column:1;font-size:13.5px;color:var(--spot-muted);min-width:0}
.spot .big{text-align:right;font-family:var(--mono);position:relative;z-index:1}
.spot .big .pct{display:block;font:800 clamp(40px,10vw,60px)/.9 var(--display);color:var(--accent);letter-spacing:-.03em}
.spot .big .now{font-weight:700;font-size:18px}
.spot .big .was{font-size:13px;color:var(--spot-muted);text-decoration:line-through;margin-left:6px}
.spot .go{grid-column:1/-1;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-top:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13.5px/1 var(--body);padding:9px 13px 9px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:7px;align-items:center;transition:background .15s,border-color .15s}
.chip svg{width:16px;height:16px;flex:none}
.chip .n{font:600 11px var(--mono);color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px;margin-top:4px}
.route{position:relative;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,#0ea5a4 16%,var(--surface)),color-mix(in srgb,var(--accent-2) 14%,var(--surface)));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.route .code{font:800 22px/1 var(--display);letter-spacing:-.02em}
.route .dest{flex:1;min-width:0;font:800 21px/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:break-word}
.route .dest small{display:block;font:500 13px/1.3 var(--body);letter-spacing:0;color:var(--muted);margin-top:3px}
.route .line{flex:none;display:flex;align-items:center;color:var(--muted)}
.route .line i{display:block;width:22px;border-top:2px dashed currentColor;opacity:.6}
.route .palm{position:absolute;top:-9px;right:12px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:#0ea5a4;color:#fff;padding:5px 8px;border-radius:999px}
.deal.trop{border-color:color-mix(in srgb,#0ea5a4 45%,var(--line))}
.finder{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%,transparent)}
.sbox:focus-within{border-color:var(--accent)}
.sbox svg{flex:none;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--body);padding:13px 0;outline:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .clr{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px;cursor:pointer}
.watchrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wnew{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:14px}
.wnew b{font-weight:700}
.wnew input{width:90px;font:600 16px var(--mono);border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--surface);color:var(--ink)}
.wnew button,.wchip{font:700 13px var(--body);border-radius:999px;padding:8px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.wnew button{background:var(--accent);border-color:var(--accent);color:#fff}
.wchip{display:inline-flex;align-items:center;gap:6px}
.wchip .n{font-family:var(--mono);color:var(--muted)}
.wchip .n.hot{color:#fff;background:var(--accent);border-radius:999px;padding:1px 7px}
.wchip .x{color:var(--muted);font-weight:500;margin-left:2px}
.flag.watch{background:var(--accent-soft);color:var(--accent)}
.shops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.shops a{font:700 14px var(--body);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--ink)}
.fdates{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin-top:-2px}
.fdates b{color:var(--ink);font-weight:700}
.more{display:block;width:100%;margin-top:6px;font:700 15px var(--body);padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0;transition:transform .15s,box-shadow .15s}
@media (hover:hover){.deal:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px color-mix(in srgb,var(--ink) 35%,transparent)}}
.deal.urgent{border-color:color-mix(in srgb,var(--urgent) 55%,var(--line))}
.deal.ended{opacity:.6}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.cat{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.cat svg{width:17px;height:17px}
.deal.urgent .cat{background:var(--urgent-soft);color:var(--urgent)}
.top .store{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .when{margin-left:auto;flex:none}
.flag{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--urgent-soft);color:var(--urgent);flex:none}
.flag.gone{background:var(--line);color:var(--muted)}
.title{font-weight:600;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.why{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.pricebar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-top:10px;border-top:1px dashed var(--line);margin-top:auto}
.pricebar .now{font-weight:700;font-size:21px}
.pricebar .was{font-size:13px;color:var(--muted);text-decoration:line-through}
.pricebar .pct{margin-left:auto;font:700 13px var(--mono);color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));padding:4px 9px;border-radius:7px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.open{font:600 13.5px var(--body);padding:9px 15px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.spot .open{background:var(--spot-ink);color:var(--spot-bg)}
.src{font-size:12.5px;color:var(--muted)}
.btn{font:600 13px var(--body);padding:9px 12px;border-radius:10px;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn svg{width:15px;height:15px}
.btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.btn[aria-pressed="true"] svg{fill:currentColor}
.spot .btn{color:var(--spot-ink);border-color:color-mix(in srgb,var(--spot-ink) 30%,transparent)}
.btn.ghost{border-color:transparent;margin-left:auto}
.chip:focus-visible,.open:focus-visible,.btn:focus-visible,.title a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font:600 13.5px var(--body);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px 22px;color:var(--muted)}
.empty h2{font:800 22px var(--display);color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
.empty ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.empty li{display:flex;gap:10px;align-items:center}
.empty li .cat{width:26px;height:26px}
.empty li .cat svg{width:15px;height:15px}
footer{margin-top:30px;font-size:12px;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap}
@media (max-width:480px){.stats{gap:8px}.stat{padding:10px 11px}.stat b{font-size:20px}.spot{grid-template-columns:1fr}.spot .big{text-align:left}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs><path d="M21.5 3H35a2 2 0 0 1 2 2v13.5a2 2 0 0 1-.6 1.4L20 36.3a2 2 0 0 1-2.8 0L3.7 22.8a2 2 0 0 1 0-2.8L20.1 3.6A2 2 0 0 1 21.5 3Z" fill="url(#lg)"/><circle cx="29" cy="11" r="3" style="fill:var(--bg)"/><path d="M14 23.5 22 15.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="14.5" cy="16.5" r="2" fill="#fff"/><circle cx="21.5" cy="22.5" r="2" fill="#fff"/></svg>
      <h1>Steal Watch</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><a href="alerts.html" id="alertsLink" hidden class="status" style="text-decoration:none;color:var(--ink);font-weight:600">🎯 Price alerts</a><div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div></div>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="sToday">0</b><span>New today</span></div>
    <div class="stat err"><b id="sErr">0</b><span>Price errors</span></div>
    <button type="button" class="stat" id="keptStat"><b id="sKept">0</b><span>Kept</span></button>
  </section>

  <section class="finder" aria-label="Search">
    <label class="sbox"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="What do you want? AirPods, Gucci, Aruba…" aria-label="Search deals"><button type="button" class="clr" id="qclr" hidden>Clear</button></label>
    <div id="watchbar" class="watchrow"></div>
  </section>
  <section id="spot" hidden></section>
  <nav class="rail" id="rail" aria-label="Categories"></nav>
  <main class="list" id="list" aria-live="polite"></main>

  <footer><span>Scanned every few minutes across Slickdeals, Google, Reddit, 9to5Toys and flight-deal sites. Sold-out deals are removed automatically. Kept deals are saved on this phone.</span><span>Prices move fast. Check the store before you buy.</span></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ICONS={
  all:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  kept:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  fashion:'<path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-.5 1.7-2 3-4 3s-3.5-1.3-4-3Z"/>',
  fragrance:'<path d="M9 3h6v3H9zM10 6v2M14 6v2M7 8h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="14.5" r="2.5"/>',
  tech:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  amazon:'<path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>',
  flights:'<path d="M3 13.5 21 6l-4 14-4.5-5.5L6 16l1-3.5Z"/><path d="m12.5 14.5 3-5"/>',
  watches:'<circle cx="12" cy="12" r="5.5"/><path d="M9 6.8 9.6 3h4.8l.6 3.8M9 17.2l.6 3.8h4.8l.6-3.8M12 9.8V12l1.5 1"/>',
  everything:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7Z"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  arrow:'<path d="M7 17 17 7M9 7h8v8"/>'
};
const svg=(k,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra}>${ICONS[k]||ICONS.everything}</svg>`;
const CATS=[["all","All"],["kept","Kept"],["fashion","Fashion"],["watches","Watches"],["fragrance","Colognes"],["tech","Tech"],["amazon","Amazon"],["tropical","🌴 Tropical"],["flights","Flights"],["everything","Other"]];
const inCat=(d,c)=>c==="tropical"?!!d.tropical:(d.category||"everything")===c;
const label=c=>(CATS.find(x=>x[0]===c)||[c,c])[1];
const $=id=>document.getElementById(id);

let deals=[], dealsLoaded=false, cat="all", lastRun=null;
let mine={kept:{},hidden:[],rev:0};            // kept: {id: deal snapshot}; hidden: [id]
let mineRef=null, writing=false, dirty=false, synced=false;
let dbRef=null, canClear=false;
// Sold out: first tap asks, second tap removes the deal for good (it stays in Kept as "Ended" if you kept it).
function soldBtn(d){
  const b=document.createElement("button");b.type="button";b.className="btn sold";b.textContent="Sold out";
  let armed=false,t=null;
  b.onclick=async()=>{
    if(!armed){armed=true;b.textContent="Tap again to remove";b.setAttribute("aria-pressed","true");t=setTimeout(()=>{armed=false;b.textContent="Sold out";b.removeAttribute("aria-pressed")},3000);return}
    clearTimeout(t);b.disabled=true;
    if(!mine.hidden.includes(d.id)){mine.hidden.push(d.id);persist()}
    deals=deals.filter(x=>x.id!==d.id);render();
    try{await dbRef.collection("deals").doc(d.id).delete();toast("Removed as sold out")}catch(e){toast("Hidden here — couldn't remove it for everyone")}
  };
  return b;
}

try{cat=localStorage.getItem("sw.cat")||"all";const l=JSON.parse(localStorage.getItem("sw.mine")||"null");if(l&&l.kept)mine={kept:l.kept,hidden:l.hidden||[],rev:l.rev||0}}catch(e){}
const saveLocal=()=>{try{localStorage.setItem("sw.cat",cat);localStorage.setItem("sw.mine",JSON.stringify(mine))}catch(e){}};

let toastTimer=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}

// Save right away (no delay, so closing the app right after tapping never loses it); one write at a time.
async function flush(){
  if(!mineRef){return}
  if(writing){dirty=true;return}
  writing=true;dirty=false;
  try{await mineRef.set({kept:mine.kept,hidden:mine.hidden.slice(-500),rev:mine.rev})}
  catch(e){const c=String((e&&(e.code||e.message))||"");if(/not_granted|permission|denied|forbidden|read.?only/i.test(c)){mineRef=null;toast("Kept on this device")}else toast("Couldn't save — check your connection");}
  finally{writing=false;if(dirty)flush()}
}
function persist(){mine.rev=Math.max(Date.now(),(mine.rev||0)+1);saveLocal();flush()}

const ago=t=>{const s=(Date.now()-new Date(t))/1000;if(!isFinite(s))return"";if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"};
const money=v=>v==null||v===""?"":(typeof v==="number"?"$"+v.toLocaleString(undefined,{maximumFractionDigits:v<100?2:0}):String(v));

  let q=t.replace(/^\[[^\]]*\]\s*/,"").replace(/^\$[\d,.]+\*?\s*\|\s*/,"").replace(/\$\s?[\d,.]+.*$/,"").replace(/\([^)]*\)/g," ").replace(/\b(at|@|from|via)\s+[A-Z][\w'&. ]*$/,"").replace(/\s+/g," ").trim().slice(0,80);

  const shop=Object.keys(SHOPS).sort((a,b)=>b.length-a.length).find(k=>new RegExp("(^|[^a-z])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z]|$)").test(hay));
  return shop?SHOPS[shop]+encodeURIComponent(q):"https://www.google.com/search?tbm=shop&q="+encodeURIComponent(q);
}
const getJSON=f=>fetch(RAW+f+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
async function load(){
  const [w,h,st]=await Promise.all([getJSON("deals.json"),getJSON("hunted.json"),getJSON("status.json")]);
  const now=Date.now(),byId=new Map();
  for(const d0 of (Array.isArray(h)?h:[])){const d=fixDeal(d0);if(d&&d.id&&!isJunk(d.title||""))byId.set(d.id,d)}                    // hand-checked by the hourly hunter
  for(const d0 of (Array.isArray(w)?w:[])){const d=fixDeal(d0);if(d&&d.id&&!byId.has(d.id)&&!isJunk(d.title||""))byId.set(d.id,d)}
  {const seenT=new Set();for(const [k,d] of [...byId].sort((a,b)=>String(b[1].found_at).localeCompare(String(a[1].found_at)))){const t=String(d.title||"").toLowerCase().replace(/[\u2013\u2014-]\s*the flight deal.*$/,"").replace(/[^a-z0-9$]+/g," ").trim().slice(0,90);if(seenT.has(t))byId.delete(k);else seenT.add(t)}} // 5-minute scan; stays until the hunter confirms it is gone
  if(!w&&!h){$("statusText").textContent="Couldn't load deals — pull to refresh";return}
  deals=[...byId.values()].sort((a,b)=>String(b.found_at).localeCompare(String(a.found_at))).slice(0,2000);
  dealsLoaded=true;
  lastRun=[st&&st.last_run,...deals.map(d=>d.checked_at||d.found_at)].filter(Boolean).sort().pop()||null;
  render();status();
}
load();setInterval(load,120000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
